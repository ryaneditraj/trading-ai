[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-1pct-radar"
version = "0.1.0"
description = "BTC 1% Radar: Binance futures structure + derivatives scorer for short-horizon ±1% moves, plus Nifty systematic research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ryan Editraj" }]
keywords = [
  "bitcoin",
  "binance-futures",
  "trading",
  "quant",
  "backtesting",
  "nifty",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "requests>=2.32",
  "yfinance>=0.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
btc-radar = "btc_radar.cli:main"

[project.urls]
Homepage = "https://github.com/ryaneditraj/trading-ai"

[tool.setuptools.packages.find]
include = ["btc_radar*"]

[tool.setuptools.package-data]
btc_radar = ["macro_events.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
